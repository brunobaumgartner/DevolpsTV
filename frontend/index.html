<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevolpsTV</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #030509;
    --bg-grid: #060a12;
    --card: #0a1420;
    --card-hover: #0e1c2e;
    --text: #d7e6f5;
    --muted: #5b7a94;
    --accent: #00d9ff;
    --accent-dim: #0a3a4d;
    --accent2: #2f6fff;
    --border: #123049;
    --danger: #ff3d6e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 0%, #071a2b 0%, transparent 45%),
      radial-gradient(circle at 100% 30%, #061622 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: "Rajdhani", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1, h2, .tab-btn, .vod-type-tabs button, .type-tag, .cat-btn, button {
    font-family: "Chakra Petch", "Rajdhani", system-ui, sans-serif;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(0,217,255,0.05), transparent);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    margin-right: auto;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(0,217,255,.5);
  }
  input[type="text"], select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    width: 320px;
    font-size: 13px;
    font-family: "Rajdhani", sans-serif;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 10px rgba(0,217,255,.35);
  }
  button {
    background: var(--accent2);
    color: #041018;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color: #041018;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .03em;
    text-transform: uppercase;
    box-shadow: 0 0 14px rgba(0,217,255,.25);
  }
  button:hover { box-shadow: 0 0 18px rgba(0,217,255,.5); }
  button.secondary {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    box-shadow: none;
  }
  button.secondary:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(0,217,255,.2); }
  button.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); box-shadow: none; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  video { width: 100%; background: black; border-radius: 4px; aspect-ratio: 16/9; border: 1px solid var(--border); }
  #status { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .categories { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .cat-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 10px;
    border-radius: 3px;
    font-size: 12px;
  }
  .cat-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(0,217,255,.25); }
  .channel-list { max-height: 70vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; background: rgba(255,255,255,.01); }
  .channel-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
  }
  .channel-item:hover { background: var(--card-hover); }
  .channel-item.playing { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
  .channel-item img { width: 28px; height: 28px; object-fit: contain; border-radius: 4px; background: #222; }
  .channel-item .name { flex: 1; }
  .channel-item .badge {
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .channel-item .now-playing {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 8px 4px;
    margin-right: 16px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); text-shadow: 0 0 8px rgba(0,217,255,.4); }
  .vod-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .vod-controls input[type="text"] { width: 100%; }
  .vod-type-tabs { display: flex; gap: 6px; }
  .vod-type-tabs button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 3px;
    font-size: 12px;
  }
  .vod-type-tabs button.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(0,217,255,.25); }
  #vod-genre { max-width: 200px; }
  .vod-count { color: var(--muted); font-size: 11px; margin: 2px 0 6px; }
  .vod-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .vod-card { cursor: pointer; font-size: 12px; transition: transform .12s; }
  .vod-card:hover { transform: translateY(-2px); }
  .vod-card .poster-wrap { position: relative; }
  .vod-card .poster {
    width: 100%;
    aspect-ratio: 2/3;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    object-fit: cover;
    display: block;
  }
  .vod-card:hover .poster, .vod-card:hover .poster-placeholder { border-color: var(--accent); box-shadow: 0 0 12px rgba(0,217,255,.3); }
  .vod-card .poster-placeholder {
    width: 100%;
    aspect-ratio: 2/3;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    border: 1px solid var(--border);
  }
  .vod-card .poster-placeholder.movie { background: linear-gradient(160deg, #0d2b52, #081826); }
  .vod-card .poster-placeholder.series { background: linear-gradient(160deg, #063a45, #061826); }
  .vod-card .type-tag {
    position: absolute;
    top: 4px;
    left: 4px;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 3px;
    color: #041018;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .vod-card .type-tag.movie { background: var(--accent2); }
  .vod-card .type-tag.series { background: var(--accent); }
  .vod-card .vod-title { margin-top: 4px; line-height: 1.3; }
  .vod-card .vod-badge {
    display: inline-block;
    font-size: 10px;
    margin-top: 2px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .vod-card .vod-badge.available { color: var(--accent); border-color: var(--accent); }
  .vod-empty { color: var(--muted); font-size: 13px; padding: 20px 0; }
  .vod-pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .vod-pager button:disabled { opacity: .4; cursor: default; }
  #lang-picker { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #lang-picker .lang-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
  #lang-picker button {
    background: var(--card-hover, #0e1c2e); border: 1px solid var(--border); color: var(--muted);
    padding: 4px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
  }
  #lang-picker button:hover { color: var(--accent); border-color: var(--accent); }
  #lang-picker button.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #041018; border-color: transparent; font-weight: 600; }
  #epg-panel { margin-top: 14px; }
  #epg-panel h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .epg-item { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .epg-item:last-child { border-bottom: none; }
  .epg-item .time { color: var(--muted); white-space: nowrap; min-width: 40px; }
  .epg-item.current .time { color: var(--accent); font-weight: 600; }
  .epg-item .title { flex: 1; }
  .epg-item.current .title { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>DevolpsTV</h1>
  <button id="my-list-btn" hidden>▶ Acessar minha lista</button>
  <input id="token" type="text" placeholder="Cole o link (ou token) da sua playlist" hidden />
  <button id="load-btn" hidden>Carregar</button>
  <a href="admin.html" style="color: var(--muted); font-size: 12px;">admin</a>
</header>

<main>
  <section>
    <video id="player" controls autoplay muted></video>
    <div id="status">Nenhum canal carregado ainda.</div>
    <div id="lang-picker" hidden></div>
    <div id="epg-panel"></div>
  </section>

  <section>
    <div class="tabs">
      <button class="tab-btn active" id="tab-live">TV ao vivo</button>
      <button class="tab-btn" id="tab-vod">Filmes e Séries</button>
    </div>

    <div id="live-panel">
      <div class="categories" id="categories"></div>
      <div class="channel-list" id="channel-list"></div>
    </div>

    <div id="vod-panel" hidden>
      <div class="vod-controls">
        <input type="text" id="vod-search" placeholder="Buscar por título..." />
        <div class="vod-type-tabs" id="vod-type-tabs">
          <button class="active" data-type="">Todos</button>
          <button data-type="movie">Filmes</button>
          <button data-type="series">Séries</button>
        </div>
        <select id="vod-genre"><option value="">Todos os gêneros</option></select>
      </div>
      <div class="vod-count" id="vod-count"></div>
      <div id="vod-grid" class="vod-grid"></div>
      <div class="vod-pager">
        <button class="secondary" id="vod-prev-page">◀ Anterior</button>
        <span id="vod-page-info"></span>
        <button class="secondary" id="vod-next-page">Próxima ▶</button>
      </div>
    </div>
  </section>
</main>

<script>
const tokenInput = document.getElementById("token");
const loadBtn = document.getElementById("load-btn");
const statusEl = document.getElementById("status");
const listEl = document.getElementById("channel-list");
const categoriesEl = document.getElementById("categories");
const video = document.getElementById("player");
const tabLiveBtn = document.getElementById("tab-live");
const tabVodBtn = document.getElementById("tab-vod");
const livePanel = document.getElementById("live-panel");
const vodPanel = document.getElementById("vod-panel");
const vodGridEl = document.getElementById("vod-grid");

let allChannels = [];
let activeCategory = null;
let hls = null;
let currentToken = null;
let playRequestId = 0; // evita que uma verificação antiga sobrescreva um clique mais novo
let vodLoaded = false;

tabLiveBtn.addEventListener("click", () => switchTab("live"));
tabVodBtn.addEventListener("click", () => switchTab("vod"));

function switchTab(tab) {
  const isLive = tab === "live";
  tabLiveBtn.classList.toggle("active", isLive);
  tabVodBtn.classList.toggle("active", !isLive);
  livePanel.hidden = !isLive;
  vodPanel.hidden = isLive;
  if (!isLive && !vodLoaded && currentToken) loadVod();
}

// lembra o token no navegador do usuário (não sai daqui, é só localStorage).
// Em aba anônima ou contexto sandboxed o localStorage pode não existir — não deve
// quebrar a página por causa disso.
function safeLocalStorage() {
  try {
    localStorage.setItem("__test__", "1");
    localStorage.removeItem("__test__");
    return localStorage;
  } catch {
    return null;
  }
}
const storage = safeLocalStorage();

tokenInput.value = (storage && storage.getItem("iptv_token")) || "";

const myListBtn = document.getElementById("my-list-btn");

loadBtn.addEventListener("click", () => loadChannels());
tokenInput.addEventListener("keydown", (e) => { if (e.key === "Enter") loadChannels(); });
myListBtn.addEventListener("click", loadMyList);

// aceita tanto o token puro quanto o link inteiro da playlist/painel
// (ex: http://.../p/<token>/playlist.m3u8) — extrai o token dos dois jeitos
function extractToken(input) {
  const trimmed = input.trim();
  const match = trimmed.match(/\/p\/([^/]+)\//);
  return match ? match[1] : trimmed;
}

// se estiver logado como admin, oferece um botão direto pra própria lista em
// vez de precisar colar token/link manualmente — quem não está logado como
// admin continua colando o link normalmente
(async function initHeader() {
  try {
    const resp = await fetch("admin/me", { credentials: "include" });
    if (resp.ok) {
      myListBtn.hidden = false;
      return;
    }
  } catch {}
  tokenInput.hidden = false;
  loadBtn.hidden = false;
})();

async function loadMyList() {
  statusEl.textContent = "Buscando sua playlist...";
  try {
    const resp = await fetch("admin/tokens", { credentials: "include" });
    if (!resp.ok) {
      statusEl.textContent = "Não foi possível localizar sua playlist automaticamente.";
      return;
    }
    const data = await resp.json();
    const token = data.tokens?.[0]?.token;
    if (!token) {
      statusEl.textContent = "Nenhum token de acesso cadastrado ainda.";
      return;
    }
    await loadChannels(token);
  } catch {
    statusEl.textContent = "Falha de rede ao buscar sua playlist.";
  }
}

async function loadChannels(tokenOverride) {
  const token = tokenOverride || extractToken(tokenInput.value);
  if (!token) {
    statusEl.textContent = "Cole um link ou token válido primeiro.";
    return;
  }
  if (storage) storage.setItem("iptv_token", token);
  currentToken = token;
  statusEl.textContent = "Carregando...";

  try {
    // caminho relativo (sem "/" no início) pra funcionar tanto na raiz quanto
    // atrás de um proxy reverso num subpath (ex: /iptv/)
    const resp = await fetch(`p/${encodeURIComponent(token)}/channels.json`);
    if (resp.status === 404) {
      statusEl.textContent = "Token inválido.";
      return;
    }
    if (!resp.ok) {
      statusEl.textContent = `Erro ao carregar (HTTP ${resp.status}).`;
      return;
    }
    const data = await resp.json();
    allChannels = data.channels || [];
    statusEl.textContent = `${allChannels.length} canais ativos.`;
    renderCategories();
    renderList();
  } catch (err) {
    statusEl.textContent = "Falha de rede ao carregar canais.";
    console.error(err);
  }
}

function renderCategories() {
  const cats = Array.from(new Set(allChannels.map((c) => c.category || "outros"))).sort();
  categoriesEl.innerHTML = "";
  const allBtn = makeCategoryButton("Todos", null);
  categoriesEl.appendChild(allBtn);
  cats.forEach((cat) => categoriesEl.appendChild(makeCategoryButton(cat, cat)));
}

function makeCategoryButton(label, value) {
  const btn = document.createElement("button");
  btn.className = "cat-btn" + (activeCategory === value ? " active" : "");
  btn.textContent = label;
  btn.addEventListener("click", () => {
    activeCategory = value;
    renderCategories();
    renderList();
  });
  return btn;
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

function renderList() {
  const filtered = activeCategory
    ? allChannels.filter((c) => (c.category || "outros") === activeCategory)
    : allChannels;

  listEl.innerHTML = "";
  filtered.forEach((ch) => {
    const item = document.createElement("div");
    item.className = "channel-item";
    const nowPlayingHtml = ch.now_playing
      ? `<span class="now-playing">▶ ${escapeHtml(ch.now_playing.title)}</span>`
      : "";
    item.innerHTML = `
      ${ch.logo_url ? `<img src="${escapeHtml(ch.logo_url)}" alt="" onerror="this.style.visibility='hidden'">` : `<div style="width:28px"></div>`}
      <span class="name">${escapeHtml(ch.name)}${nowPlayingHtml}</span>
      ${ch.is_broadcast_tv ? '<span class="badge">TV aberta</span>' : ""}
    `;
    item.addEventListener("click", () => playChannel(ch, item));
    listEl.appendChild(item);
  });
}

function formatTime(isoString) {
  const d = new Date(isoString);
  return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

async function loadEpgPanel(channel) {
  const panel = document.getElementById("epg-panel");
  panel.innerHTML = "";
  try {
    const resp = await fetch(
      `p/${encodeURIComponent(currentToken)}/channels/${encodeURIComponent(channel.tvg_id)}/epg`
    );
    if (!resp.ok) return;
    const data = await resp.json();
    if (!data.has_epg || !data.programs.length) return;

    const now = new Date();
    const items = data.programs
      .slice(0, 6)
      .map((p) => {
        const isCurrent = new Date(p.starts_at) <= now && new Date(p.ends_at) > now;
        return `
        <div class="epg-item ${isCurrent ? "current" : ""}">
          <span class="time">${formatTime(p.starts_at)}</span>
          <span class="title">${escapeHtml(p.title)}</span>
        </div>`;
      })
      .join("");
    panel.innerHTML = `<h2>Programação — ${escapeHtml(channel.name)}</h2>${items}`;
  } catch {
    // EPG é um extra — falha aqui não deve incomodar quem só quer assistir
  }
}

const LANG_PREF_KEY = "devolpstv:lang";

function renderLangPicker(channel, activeLabel) {
  const el = document.getElementById("lang-picker");
  const langs = channel.languages || [];
  if (langs.length < 2) {
    el.hidden = true;
    el.innerHTML = "";
    return;
  }
  el.hidden = false;
  el.innerHTML = '<span class="lang-label">Idioma:</span>';
  langs.forEach((g) => {
    const btn = document.createElement("button");
    btn.textContent = g.label;
    btn.className = g.label === activeLabel ? "active" : "";
    btn.addEventListener("click", () => {
      if (g.label === activeLabel) return;
      try { localStorage.setItem(LANG_PREF_KEY, g.label); } catch {}
      playChannel(channel, document.querySelector(".channel-item.playing"), g.label);
    });
    el.appendChild(btn);
  });
}

function pickInitialLang(channel) {
  const langs = channel.languages || [];
  if (langs.length < 2) return langs[0] ? langs[0].label : null;
  let pref = null;
  try { pref = localStorage.getItem(LANG_PREF_KEY); } catch {}
  if (pref && langs.some((g) => g.label === pref)) return pref;
  const pt = langs.find((g) => g.label === "Português");
  return pt ? pt.label : langs[0].label;
}

async function playChannel(channel, itemEl, langLabel) {
  document.querySelectorAll(".channel-item.playing").forEach((el) => el.classList.remove("playing"));
  if (itemEl) itemEl.classList.add("playing");
  loadEpgPanel(channel);

  const lang = langLabel || pickInitialLang(channel);
  renderLangPicker(channel, lang);

  const myRequestId = ++playRequestId;
  statusEl.textContent = `Verificando "${channel.name}"${lang && (channel.languages || []).length > 1 ? " (" + lang + ")" : ""}...`;

  // Verificação ao vivo no servidor: o cache do health-check (a cada 15min) não é
  // confiável o suficiente com fontes tão instáveis quanto essas — confirma agora.
  let liveUrl = null;
  let groupUrls = [];
  try {
    const qs = lang ? `?lang=${encodeURIComponent(lang)}` : "";
    const resp = await fetch(
      `p/${encodeURIComponent(currentToken)}/channels/${encodeURIComponent(channel.tvg_id)}/resolve${qs}`
    );
    if (myRequestId !== playRequestId) return; // usuário já clicou em outro canal enquanto isso

    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      statusEl.textContent = body.detail || `"${channel.name}" está indisponível agora.`;
      return;
    }
    const data = await resp.json();
    liveUrl = data.url;
  } catch (err) {
    if (myRequestId !== playRequestId) return;
    statusEl.textContent = `Falha de rede ao verificar "${channel.name}".`;
    return;
  }

  // fallbacks: os outros mirrors do MESMO idioma escolhido
  const group = (channel.languages || []).find((g) => g.label === lang);
  groupUrls = group ? group.stream_urls : channel.stream_urls || [];
  const fallbacks = groupUrls.filter((u) => u !== liveUrl);
  tryMirror(channel, [liveUrl, ...fallbacks], 0);
}

function reportFailure(channel, url) {
  // best-effort: não bloqueia a UI nem trata erro — é só telemetria pro backend
  // parar de oferecer esse mirror pros próximos usuários (ver ARQUITETURA.md 8.2)
  fetch(`p/${encodeURIComponent(currentToken)}/channels/${encodeURIComponent(channel.tvg_id)}/report-failure`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url }),
  }).catch(() => {});
}

function removeChannelFromList(channel) {
  allChannels = allChannels.filter((c) => c.tvg_id !== channel.tvg_id);
  renderCategories();
  renderList();
}

function tryMirror(channel, mirrors, index) {
  if (index >= mirrors.length) {
    statusEl.textContent = `"${channel.name}" foi removido da lista: nenhum dos ${mirrors.length} servidor(es) tocou de verdade no seu navegador, mesmo aprovado na verificação do servidor.`;
    removeChannelFromList(channel);
    return;
  }

  statusEl.textContent =
    mirrors.length > 1
      ? `Reproduzindo: ${channel.name} (servidor ${index + 1}/${mirrors.length})`
      : `Reproduzindo: ${channel.name}`;

  const url = mirrors[index];
  const goToNextMirror = () => {
    reportFailure(channel, url);
    tryMirror(channel, mirrors, index + 1);
  };
  playUrl(url, goToNextMirror);
}

// toca uma URL no player, com fallback comum entre HLS.js e o <video> nativo.
// onFatalError é chamado se a reprodução falhar de vez (opcional).
function playUrl(url, onFatalError) {
  if (hls) {
    hls.destroy();
    hls = null;
  }

  const isM3u8 = /\.m3u8(\?|$)/i.test(url);

  if (isM3u8 && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (_evt, data) => {
      if (data.fatal && onFatalError) onFatalError();
    });
  } else if (isM3u8 && video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.onerror = onFatalError || null;
  } else {
    // arquivo direto (ex: .mp4) — não precisa de HLS.js
    video.src = url;
    video.onerror = onFatalError || null;
  }
}

// --- Filmes e Séries (catálogo VOD) ---

let currentVodTitles = [];
let vodActiveType = ""; // "" | "movie" | "series"
let vodActiveGenre = "";
let vodSearchTerm = "";
let vodPage = 0;
const VOD_PAGE_SIZE = 60;

const vodSearchEl = document.getElementById("vod-search");
const vodGenreEl = document.getElementById("vod-genre");
const vodTypeTabsEl = document.getElementById("vod-type-tabs");
const vodCountEl = document.getElementById("vod-count");
const vodPageInfoEl = document.getElementById("vod-page-info");
const vodPrevBtn = document.getElementById("vod-prev-page");
const vodNextBtn = document.getElementById("vod-next-page");

let vodSearchDebounce = null;
vodSearchEl.addEventListener("input", () => {
  clearTimeout(vodSearchDebounce);
  vodSearchDebounce = setTimeout(() => {
    vodSearchTerm = vodSearchEl.value.trim().toLowerCase();
    vodPage = 0;
    renderVodGrid();
  }, 200);
});

vodTypeTabsEl.querySelectorAll("button").forEach((btn) => {
  btn.addEventListener("click", () => {
    vodTypeTabsEl.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    vodActiveType = btn.dataset.type;
    vodPage = 0;
    renderVodGrid();
  });
});

vodGenreEl.addEventListener("change", () => {
  vodActiveGenre = vodGenreEl.value;
  vodPage = 0;
  renderVodGrid();
});

vodPrevBtn.addEventListener("click", () => {
  if (vodPage > 0) {
    vodPage--;
    renderVodGrid();
  }
});
vodNextBtn.addEventListener("click", () => {
  vodPage++;
  renderVodGrid();
});

async function loadVod() {
  vodGridEl.innerHTML = `<div class="vod-empty">Carregando...</div>`;
  try {
    const resp = await fetch(`p/${encodeURIComponent(currentToken)}/vod`);
    if (!resp.ok) {
      vodGridEl.innerHTML = `<div class="vod-empty">Falha ao carregar o catálogo.</div>`;
      return;
    }
    const data = await resp.json();
    vodLoaded = true;
    currentVodTitles = data.titles || [];
    populateVodGenres();
    renderVodGrid();
  } catch {
    vodGridEl.innerHTML = `<div class="vod-empty">Falha de rede ao carregar o catálogo.</div>`;
  }
}

function populateVodGenres() {
  const genres = Array.from(new Set(currentVodTitles.map((t) => t.genre).filter(Boolean))).sort();
  vodGenreEl.innerHTML =
    `<option value="">Todos os gêneros</option>` + genres.map((g) => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join("");
}

function filteredVodTitles() {
  return currentVodTitles.filter((t) => {
    if (vodActiveType && t.type !== vodActiveType) return false;
    if (vodActiveGenre && t.genre !== vodActiveGenre) return false;
    if (vodSearchTerm && !t.title.toLowerCase().includes(vodSearchTerm)) return false;
    return true;
  });
}

function renderVodGrid() {
  if (!currentVodTitles.length) {
    vodGridEl.innerHTML = `<div class="vod-empty">Catálogo ainda vazio — adicione títulos conforme for conseguindo autorização (ver README.md).</div>`;
    vodCountEl.textContent = "";
    vodPageInfoEl.textContent = "";
    vodPrevBtn.disabled = true;
    vodNextBtn.disabled = true;
    return;
  }

  const filtered = filteredVodTitles();
  if (!filtered.length) {
    vodGridEl.innerHTML = `<div class="vod-empty">Nenhum título encontrado com esse filtro.</div>`;
    vodCountEl.textContent = `0 de ${currentVodTitles.length} título(s)`;
    vodPageInfoEl.textContent = "";
    vodPrevBtn.disabled = true;
    vodNextBtn.disabled = true;
    return;
  }

  const totalPages = Math.max(1, Math.ceil(filtered.length / VOD_PAGE_SIZE));
  vodPage = Math.min(vodPage, totalPages - 1);
  const start = vodPage * VOD_PAGE_SIZE;
  const pageItems = filtered.slice(start, start + VOD_PAGE_SIZE);

  vodCountEl.textContent = `${filtered.length} de ${currentVodTitles.length} título(s)`;
  vodPageInfoEl.textContent = `Página ${vodPage + 1} de ${totalPages}`;
  vodPrevBtn.disabled = vodPage <= 0;
  vodNextBtn.disabled = vodPage >= totalPages - 1;

  vodGridEl.innerHTML = "";
  pageItems.forEach((t) => {
    const card = document.createElement("div");
    card.className = "vod-card";
    const badge = t.available
      ? '<span class="vod-badge available">disponível</span>'
      : '<span class="vod-badge">sem link ainda</span>';
    const typeLabel = t.type === "movie" ? "Filme" : "Série";
    const typeClass = t.type === "movie" ? "movie" : "series";
    const posterHtml = t.poster_url
      ? `<img class="poster" src="${escapeHtml(t.poster_url)}" alt="" onerror="this.outerHTML='<div class=&quot;poster-placeholder ${typeClass}&quot;>${typeClass === "movie" ? "🎬" : "📺"}</div>'">`
      : `<div class="poster-placeholder ${typeClass}">${typeClass === "movie" ? "🎬" : "📺"}</div>`;
    card.innerHTML = `
      <div class="poster-wrap">
        ${posterHtml}
        <span class="type-tag ${typeClass}">${typeLabel}</span>
      </div>
      <div class="vod-title">${escapeHtml(t.title)}</div>
      ${badge}
    `;
    card.addEventListener("click", () => openVodTitle(t));
    vodGridEl.appendChild(card);
  });
}

async function openVodTitle(title) {
  const panel = document.getElementById("epg-panel");
  switchTab("live"); // volta pro player pra assistir
  statusEl.textContent = `Carregando "${title.title}"...`;
  panel.innerHTML = "";

  try {
    const resp = await fetch(`p/${encodeURIComponent(currentToken)}/vod/${title.id}`);
    if (!resp.ok) {
      statusEl.textContent = `Falha ao carregar "${title.title}".`;
      return;
    }
    const data = await resp.json();

    if (data.type === "movie") {
      const item = data.items[0];
      if (!item || !item.available) {
        statusEl.textContent = `"${title.title}" ainda não tem link cadastrado.`;
        return;
      }
      statusEl.textContent = `Reproduzindo: ${title.title}`;
      playUrl(item.stream_url, () => {
        statusEl.textContent = `Falha ao reproduzir "${title.title}".`;
      });
      return;
    }

    // série: mostra lista de episódios pra escolher
    statusEl.textContent = `${title.title} — escolha um episódio abaixo.`;
    const items = data.items
      .map((i) => {
        const label = `T${i.season_number ?? "?"}E${i.episode_number ?? "?"} — ${escapeHtml(i.episode_title || "")}`;
        const cls = i.available ? "epg-item" : "epg-item current";
        return `<div class="${cls}" data-item-id="${i.id}" style="cursor:${i.available ? "pointer" : "default"}">
          <span class="title">${label}${i.available ? "" : " (sem link ainda)"}</span>
        </div>`;
      })
      .join("");
    panel.innerHTML = `<h2>Episódios — ${escapeHtml(title.title)}</h2>${items}`;

    data.items.forEach((i) => {
      if (!i.available) return;
      const el = panel.querySelector(`[data-item-id="${i.id}"]`);
      el.addEventListener("click", () => {
        statusEl.textContent = `Reproduzindo: ${title.title} — T${i.season_number}E${i.episode_number}`;
        playUrl(i.stream_url, () => {
          statusEl.textContent = `Falha ao reproduzir esse episódio.`;
        });
      });
    });
  } catch {
    statusEl.textContent = `Falha de rede ao carregar "${title.title}".`;
  }
}
</script>
